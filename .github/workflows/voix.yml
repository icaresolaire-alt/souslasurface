name: Voix off (OmniVoice)
on:
  push:
    branches: [main]
    paths: ['voix/demandes/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: voix, cancel-in-progress: false }
jobs:
  voix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Cache modèle et paquets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: omnivoice-v1
      - name: Installation
        run: |
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install omnivoice soundfile
      - name: Génération
        run: python voix/generer.py
      - name: Renvoi des fichiers
        run: |
          git config user.name "voix-bot"; git config user.email "actions@github.com"
          git add voix/sorties
          git diff --cached --quiet && exit 0
          git commit -m "Voix générées"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
